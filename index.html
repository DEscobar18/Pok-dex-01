<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex Pro</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="LOGO NOVA.png" type="image/x-icon">

</head>

<body>

    <div id="area">

        <h1 id="harea">
            <img src="LOGO NOVA.png" alt="Logo Pokédex">
            Pokédex Pro
        </h1>

        <button type="button" id="pokedex"> ⬤  Pokedex </button>

        <button type="button" id="bFavoritos"> ❤︎ Favoritos </button>

        <button type="button" id="bregioes"> ➤ Regioes </button>

    </div>

    <div id="body">

        <h1 id="hbody">
            Pokédex Pro
        </h1>

        <p id="pbody">
            Explore mais de 1000 espécies
        </p>

        <input type="text" id="pesquisa" placeholder="Busque por nome ou numero">

        <button type="button" id="btodos">
            Todos
        </button>

        <button type="button" id="bfogo">
            Fogo
        </button>

        <button type="button" id="bagua">
            Agua
        </button>

        <button type="button" id="bplanta">
            Planta
        </button>

        <button type="button" id="beletrico">
            Eletrico
        </button>

        <div id="pokemon">

            <div class="card">

                <div class="imagem">

                    <span>#001</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png"
                        alt="Bulbasaur"
                    >

                </div>

                <h2>
                    Bulbasaur
                </h2>

                <div class="tipos">

                    <label class="planta">
                        Planta
                    </label>

                    <label class="venenoso">
                        Venenoso
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#002</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/2.png"
                        alt="Ivysaur"
                    >

                </div>

                <h2>
                    Ivysaur
                </h2>

                <div class="tipos">

                    <label class="planta">
                        Planta
                    </label>

                    <label class="venenoso">
                        Venenoso
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#003</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png"
                        alt="Venusaur"
                    >

                </div>

                <h2>
                    Venusaur
                </h2>

                <div class="tipos">

                    <label class="planta">
                        Planta
                    </label>

                    <label class="venenoso">
                        Venenoso
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#004</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png"
                        alt="Charmander"
                    >

                </div>

                <h2>
                    Charmander
                </h2>

                <div class="tipos">

                    <label class="fogo">
                        Fogo
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#005</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/5.png"
                        alt="Charmeleon"
                    >

                </div>

                <h2>
                    Charmeleon
                </h2>

                <div class="tipos">

                    <label class="fogo">
                        Fogo
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#006</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png"
                        alt="Charizard"
                    >

                </div>

                <h2>
                    Charizard
                </h2>

                <div class="tipos">

                    <label class="fogo">
                        Fogo
                    </label>

                    <label class="voador">
                        Voador
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#007</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png"
                        alt="Squirtle"
                    >

                </div>

                <h2>
                    Squirtle
                </h2>

                <div class="tipos">

                    <label class="agua">
                        Água
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#008</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/8.png"
                        alt="Wartortle"
                    >

                </div>

                <h2>
                    Wartortle
                </h2>

                <div class="tipos">

                    <label class="agua">
                        Água
                    </label>

                </div>

            </div>

            <div class="card">

                <div class="imagem">

                    <span>#009</span>

                    <img
                        src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png"
                        alt="Blastoise"
                    >

                </div>

                <h2>
                    Blastoise
                </h2>

                <div class="tipos">

                    <label class="agua">
                        Água
                    </label>

                    <label class="lutador">
                        Lutador
                    </label>
                </div>
            </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
